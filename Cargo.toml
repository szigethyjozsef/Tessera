[workspace]
resolver = "2"
members = ["crates/vault-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"